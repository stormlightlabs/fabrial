# Opens a draft pull request for an agent's work branch (claude/, codex/ or
# storm/) as stormlight-thunderbot, so the owner can approve it under the
# ruleset on main. Ported from desertthunder/knowledgebase.
#
# The title is the branch's first commit subject and the body is that commit's
# body without its trailers, so it needs no model. A title or body set later by
# hand or by an agent is kept. The PR stays a draft until its review finishes;
# the Review gate then marks it ready and turns on auto-merge, so it lands once
# the owner approves it and the checks pass. On a PR that is already ready, a
# push turns auto-merge off and on again to pick up the current title and body.
# The squash commit takes the PR title, and its body from the PR body through
# .github/storm/squash-body.sh, whose only trailer is a Co-authored-by line for
# the owner.
name: Branch PR

on:
  push:
    branches: ["claude/**", "codex/**", "storm/**"]

permissions:
  contents: read

concurrency:
  group: branch-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v2
        id: app
        with:
          app-id: ${{ secrets.THUNDERBOT_APP_ID }}
          private-key: ${{ secrets.THUNDERBOT_PRIVATE_KEY }}

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Open or update the PR
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          BRANCH: ${{ github.ref_name }}
        run: |
          # Credits the owner, who reviewed and approved, on the squash commit.
          # Read from main's settings, as the Review gate does, so a branch
          # cannot change the trailer and one cut before the file still works.
          # Until main has the file, as on the push that adds it, read the
          # branch's own copy; the owner's approval still gates the merge.
          settings=origin/main
          if ! git cat-file -e origin/main:.github/fabrial.toml 2>/dev/null; then
            settings=HEAD
          fi
          OWNER_TRAILER=$(git show "$settings:.github/fabrial.toml" 2>/dev/null \
            | sed -n 's/^trailer = "\(.*\)"$/\1/p' || true)
          if [[ -z "$OWNER_TRAILER" ]]; then
            echo "::error title=settings::.github/fabrial.toml has no trailer on main or this branch."
            exit 1
          fi
          subjects=$(git log --reverse --format=%s origin/main..HEAD)
          if [[ -z "$subjects" ]]; then
            echo "No commits ahead of main."
            exit 0
          fi

          number=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [[ -z "$number" ]]; then
            title=$(printf '%s\n' "$subjects" | head -n 1)
            first=$(git rev-list --reverse origin/main..HEAD | head -n 1)
            # The text above the footer becomes the squash commit body.
            {
              text=$(git show -s --format=%b "$first" | .github/storm/squash-body.sh --text)
              [[ -z $text ]] || printf '%s\n\n' "$text"
              echo '<!-- fabrial:footer: the text above becomes the squash commit body. -->'
              echo "From \`$BRANCH\`. Draft until the review finishes; approve to merge."
            } > body.md
            # GitHub skips CODEOWNERS on a draft and requests the owner's
            # review when the Review gate marks it ready. Asking with
            # --reviewer fails with "Could not add requested reviewers".
            gh pr create --draft --base main --head "$BRANCH" --title "$title" --body-file body.md
            number=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')
          else
            title=$(gh pr view "$number" --json title --jq .title)
            gh pr view "$number" --json body --jq .body > body.md
            # `/storm:stop` labels the PR and turns auto-merge off. Turn it off
            # again in case something turned it back on since, and stop there.
            if gh pr view "$number" --json labels --jq '.labels[].name' | grep -qx 'storm:stopped'; then
              gh pr merge "$number" --disable-auto >/dev/null 2>&1 || true
              echo "#$number is labelled storm:stopped; auto-merge is off."
              exit 0
            fi
          fi

          # A draft waits for its review: the Review gate marks it ready and
          # turns on auto-merge when `Review finished` names its head.
          if [[ $(gh pr view "$number" --json isDraft --jq .isDraft) == true ]]; then
            echo "#$number is a draft; auto-merge waits for the review."
            exit 0
          fi

          # The ruleset then holds the merge until the owner approves. The
          # explicit message keeps the agents' Co-authored-by trailers off main.
          # Auto-merge keeps the commit message from when it was turned on, so
          # turn it off and on again to pick up the current title and body.
          # The repository deletes merged branches itself.
          gh pr merge "$BRANCH" --disable-auto >/dev/null 2>&1 || true
          if ! out=$(gh pr merge "$BRANCH" --auto --squash \
            --subject "$title" --body "$(.github/storm/squash-body.sh "$BRANCH" "$OWNER_TRAILER" < body.md)" 2>&1); then
            echo "::error title=auto-merge::$out"
            exit 1
          fi

          # A `/storm:stop` that landed after the label check above would be
          # undone by the call just made, so look again and turn it back off.
          if gh pr view "$BRANCH" --json labels --jq '.labels[].name' | grep -qx 'storm:stopped'; then
            gh pr merge "$BRANCH" --disable-auto
            echo "Labelled storm:stopped while enabling auto-merge; turned it off again."
          fi
