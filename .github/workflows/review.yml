# Keeps the storm/review check, which the ruleset on main requires. The agent
# that opened a pull request reviews it in its own session with the `fab-storm`
# skill and ends with `Review finished at <sha>`, posted as the bot through the
# Bot comment workflow (or by a person). It runs no model: `fab gate` marks
# each new head as waiting for review, a completed run that fails, and turns
# the check green on that comment, on `/storm:ready <sha>` (or
# `/storm:done <sha>`), or on an approving review of the head. An edit to the
# title or body sets the squash message again, in the status comment. The
# `if` below lets in only the owner, members and collaborators, and any App's
# bot; `fab gate` then ignores a person without write access and every App
# but the one `app` in .github/fabrial.toml names. It ignores every App's
# review.
#
# pull_request_target runs this file from main, and `fab` is the release
# .github/fabrial.toml names (in fabrial itself, built from main), so a change
# cannot alter its own gate. The head is checked out only for git to read.
# A review reaches the gate through Review approval (review-approval.yml),
# which runs from the head and holds nothing; workflow_run runs this file from
# main, and `fab gate` reads the reviews from the API, taking from the run
# only the branch that names the pull request. Every event runs with main as
# the ref, so the job may use an environment restricted to main, which
# `environment` in .github/fabrial.toml names.
name: Review gate

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, edited]
  issue_comment:
    types: [created]
  workflow_run:
    workflows: [Review approval]
    types: [completed]

permissions:
  contents: read

# Edits to one pull request run one at a time, so the last run reads the last
# text. Other events get a group of their own and never wait.
concurrency:
  group: ${{ github.event.action == 'edited' && format('gate-edit-{0}', github.event.pull_request.number) || format('gate-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  gate:
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.event == 'pull_request_review' &&
       github.event.workflow_run.conclusion == 'success') ||
      (github.event.issue.pull_request &&
       ((startsWith(github.event.comment.body, 'Review finished at ') &&
         github.event.comment.user.type == 'Bot') ||
        ((startsWith(github.event.comment.body, 'Review finished at ') ||
          startsWith(github.event.comment.body, '/storm:ready') ||
          startsWith(github.event.comment.body, '/storm:done')) &&
         github.event.comment.user.type != 'Bot' &&
         contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association))))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v2
        id: app
        with:
          app-id: ${{ secrets.THUNDERBOT_APP_ID }}
          private-key: ${{ secrets.THUNDERBOT_PRIVATE_KEY }}

      # A push run works on the head its event names, not the newest one, so
      # runs need no ordering: each sets the check on its own commit. A comment
      # run reads the head when it starts and accepts only a SHA naming it.
      # A review run finds the open pull request into main from the branch
      # its run names, a fork's included, since workflow_run lists no pull
      # request for a fork; then it reads the head as a comment run does.
      - name: Find the head
        id: pr
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          PR: ${{ github.event.pull_request.number || github.event.issue.number }}
          EVENT_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_OWNER: ${{ github.event.workflow_run.head_repository.owner.login }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          if [ -z "$PR" ] && [ -n "$HEAD_OWNER" ] && [ -n "$HEAD_BRANCH" ]; then
            PR=$(gh api -X GET "repos/$GITHUB_REPOSITORY/pulls" -f state=open -f base=main \
              -f head="$HEAD_OWNER:$HEAD_BRANCH" --jq '.[0].number // empty')
          fi
          if [ -z "$PR" ]; then
            echo "No open pull request into main from $HEAD_OWNER:$HEAD_BRANCH."
            exit 0
          fi
          echo "number=$PR" >> "$GITHUB_OUTPUT"
          echo "sha=${EVENT_SHA:-$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq .headRefOid)}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5
        if: steps.pr.outputs.number != ''
        with:
          ref: main
          persist-credentials: false

      - uses: actions/checkout@v5
        if: steps.pr.outputs.number != ''
        with:
          ref: ${{ steps.pr.outputs.sha }}
          path: head
          fetch-depth: 0
          persist-credentials: false

      # fabrial builds its own gate from main; a repository that installs
      # fabrial runs the release that wrote its files.
      - uses: ./.github/actions/fab
        if: steps.pr.outputs.number != ''
        with:
          command: gate

      - name: Set the check
        if: steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPO: ${{ github.repository }}
          PR: ${{ steps.pr.outputs.number }}
          HEAD_SHA: ${{ steps.pr.outputs.sha }}
          EVENT: ${{ github.event_name == 'issue_comment' && 'comment' || github.event_name == 'workflow_run' && 'approve' || github.event.action == 'edited' && 'edit' || 'push' }}
          ACTION: ${{ github.event.action }}
          BEFORE: ${{ github.event.before }}
          BODY: ${{ github.event.comment.body }}
          AUTHOR: ${{ github.event.comment.user.login }}
          SENDER: ${{ github.event.sender.login }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
        run: fab gate
