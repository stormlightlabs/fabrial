# Tags a release when the Release workflow's pull request merges: the push to
# main raises the workspace version, and GitHub names storm/release-<version>
# as the merged pull request behind the commit, whatever its squash message
# says. It publishes a GitHub release with that version's section of
# CHANGELOG.md, on the merge commit the owner approved. A revert or a hand edit
# of the version tags nothing. To tag a release merge a run missed, run this
# from the Actions tab with that commit; a re-run uses the workflow as it was
# at that commit.
name: Release tag

on:
  push:
    branches: [main]
    paths: [Cargo.toml]
  workflow_dispatch:
    inputs:
      commit:
        description: The release pull request's merge commit on main
        required: true

permissions:
  contents: read

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v2
        id: app
        with:
          app-id: ${{ secrets.THUNDERBOT_APP_ID }}
          private-key: ${{ secrets.THUNDERBOT_PRIVATE_KEY }}

      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.commit || github.sha }}
          fetch-depth: 2

      - name: Tag and publish
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPO: ${{ github.repository }}
        run: |
          sha=$(git rev-parse HEAD)
          # A dispatched commit must be on main, not only somewhere in the repository.
          status=$(gh api "repos/$REPO/compare/$sha...main" --jq .status)
          if [[ $status != ahead && $status != identical ]]; then
            echo "::error title=release::$sha is not on main; nothing was tagged."
            exit 1
          fi
          version() {
            sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"$/\1/p'
          }
          now=$(version < Cargo.toml)
          before=$(git show HEAD^:Cargo.toml | version)
          if [[ $now == "$before" || $(printf '%s\n%s\n' "$before" "$now" | sort -V | tail -n 1) != "$now" ]]; then
            echo "The version did not rise ($before to $now); nothing to tag."
            exit 0
          fi
          # The commit must be the merge of the bot's storm/release-<version>
          # pull request from this repository.
          release=$(gh api "repos/$REPO/commits/$sha/pulls" | jq --arg sha "$sha" --arg ref "storm/release-$now" --arg repo "$REPO" \
            '[.[] | select(.merge_commit_sha == $sha and .merged_at != null and .head.ref == $ref
              and .head.repo.full_name == $repo and .user.login == "stormlight-thunderbot[bot]")] | length')
          if [[ $release == 0 ]]; then
            echo "::error title=release::The version rose to $now outside a Release pull request; nothing was tagged."
            exit 1
          fi
          if gh release view "v$now" >/dev/null 2>&1; then
            echo "v$now is already released."
            exit 0
          fi
          # gh would publish on an existing tag and ignore --target, so a tag
          # made by hand elsewhere stops the run instead.
          if git ls-remote --exit-code --tags origin "refs/tags/v$now" >/dev/null; then
            echo "::error title=tag::v$now is tagged but not released; check that the tag is on $sha and publish it by hand."
            exit 1
          fi
          # The section from this version's heading to the next heading.
          awk -v v="$now" '
            $0 ~ "^## " v "( |$)" { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error title=changelog::CHANGELOG.md has no notes under '## $now'."
            exit 1
          fi
          gh release create "v$now" --target "$sha" --title "v$now" --notes-file notes.md
