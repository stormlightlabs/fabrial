# Tags a release when the Release PR workflow's pull request merges: the push to
# main raises the workspace version, and GitHub names storm/release-<version>
# as the merged pull request behind the commit, whatever its squash message
# says. It tags v<version> on the merge commit the owner approved, which
# starts the dist workflow (release.yml): that builds fab and publishes the
# GitHub release with the version's section of CHANGELOG.md. A revert or a
# hand edit of the version tags nothing. To tag a release merge a run missed, run this
# from the Actions tab with that commit; a re-run uses the workflow as it was
# at that commit.
name: Release tag

on:
  push:
    branches: [main]
    paths: [Cargo.toml]
  workflow_dispatch:
    inputs:
      commit:
        description: The release pull request's merge commit on main
        required: true

permissions:
  contents: read

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v2
        id: app
        with:
          app-id: ${{ secrets.THUNDERBOT_APP_ID }}
          private-key: ${{ secrets.THUNDERBOT_PRIVATE_KEY }}

      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.commit || github.sha }}
          fetch-depth: 2

      - name: Tag
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPO: ${{ github.repository }}
        run: |
          sha=$(git rev-parse HEAD)
          # A dispatched commit must be on main, not only somewhere in the repository.
          status=$(gh api "repos/$REPO/compare/$sha...main" --jq .status)
          if [[ $status != ahead && $status != identical ]]; then
            echo "::error title=release::$sha is not on main; nothing was tagged."
            exit 1
          fi
          version() {
            sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"$/\1/p'
          }
          now=$(version < Cargo.toml)
          before=$(git show HEAD^:Cargo.toml | version)
          if [[ $now == "$before" || $(printf '%s\n%s\n' "$before" "$now" | sort -V | tail -n 1) != "$now" ]]; then
            echo "The version did not rise ($before to $now); nothing to tag."
            exit 0
          fi
          # The commit must be the merge of a storm/release-<version> pull
          # request from this repository; the owner's approval of it is the
          # gate. GitHub can take a moment to link a fresh merge to its pull
          # request, so ask three times.
          set -o pipefail
          for attempt in 1 2 3; do
            release=$(gh api "repos/$REPO/commits/$sha/pulls" | jq --arg sha "$sha" --arg ref "storm/release-$now" --arg repo "$REPO" \
              '[.[] | select(.merge_commit_sha == $sha and .merged_at != null and .head.ref == $ref
                and .head.repo.full_name == $repo)] | length')
            [[ $release =~ ^[0-9]+$ ]] || { echo "::error title=release::Cannot read the pull request behind $sha."; exit 1; }
            (( release > 0 )) && break
            (( attempt < 3 )) && sleep 10
          done
          if (( release == 0 )); then
            echo "::error title=release::The version rose to $now outside a storm/release-$now pull request; nothing was tagged. If it was one, run Release tag from the Actions tab with $sha."
            exit 1
          fi
          # A tag already on this commit is done; one elsewhere stops the run.
          if tagged=$(git ls-remote --tags origin "refs/tags/v$now" | cut -f1) && [[ -n $tagged ]]; then
            if [[ $tagged == "$sha" ]]; then
              echo "v$now is already tagged on $sha."
              exit 0
            fi
            echo "::error title=tag::v$now is tagged on $tagged, not $sha."
            exit 1
          fi
          # dist publishes this section as the release notes.
          awk -v v="$now" '
            $0 ~ "^## " v "( |$)" { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error title=changelog::CHANGELOG.md has no notes under '## $now'."
            exit 1
          fi
          # The App token's tag push starts the dist workflow; a push made with
          # GITHUB_TOKEN would not.
          gh api "repos/$REPO/git/refs" -f "ref=refs/tags/v$now" -f "sha=$sha" >/dev/null
