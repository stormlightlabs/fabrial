# Tags a release when a push to main changes the workspace version, which only
# the Release workflow's pull request does, and publishes a GitHub release with
# that version's section of CHANGELOG.md. The tag lands on the merge commit the
# owner approved.
name: Release tag

on:
  push:
    branches: [main]
    paths: [Cargo.toml]

permissions:
  contents: read

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v2
        id: app
        with:
          app-id: ${{ secrets.THUNDERBOT_APP_ID }}
          private-key: ${{ secrets.THUNDERBOT_PRIVATE_KEY }}

      - uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Tag and publish
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          version() {
            sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"$/\1/p'
          }
          now=$(version < Cargo.toml)
          before=$(git show HEAD^:Cargo.toml | version)
          if [[ $now == "$before" ]]; then
            echo "The version stays $now; nothing to tag."
            exit 0
          fi
          if gh release view "v$now" >/dev/null 2>&1; then
            echo "v$now is already released."
            exit 0
          fi
          # The section from this version's heading to the next heading.
          awk -v v="$now" '
            $0 ~ "^## " v "( |$)" { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          gh release create "v$now" --target "$GITHUB_SHA" --title "v$now" --notes-file notes.md
