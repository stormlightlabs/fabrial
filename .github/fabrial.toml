# fabrial's settings for this repository. The Branch PR workflow, the Review
# gate and the skills read them. Each value is one line: key = "value".

# GitHub login of the person who approves pull requests; `fab init` writes
# CODEOWNERS from it.
owner = "desertthunder"

# The slug of the GitHub App the workflows act as, from its page
# github.com/apps/<slug>. Its comments come from <slug>[bot].
app = "stormlight-thunderbot"

# The prefix of the secrets holding the App's ID and key: the workflows
# read THUNDERBOT_APP_ID and THUNDERBOT_PRIVATE_KEY.
secret_prefix = "THUNDERBOT"

# The Co-authored-by trailer on every squash commit.
trailer = "Owais <desertthunder.dev@gmail.com>"

# The command agents run before pushing.
gates = "just check"

# "on" adds an Assisted-by line to every squash commit for each agent
# model its pull request's commits name.
assisted_by = "on"

# Ignored paths fab cleanup may delete with a merged worktree, beside
# target/: caches a tool rebuilds.
disposable = [".arcl/arcl.db", ".arcl/arcl.db-sync.lock", ".arcl/arcl.db-wal", ".arcl/arcl.db-shm"]

# Directories whose Markdown and TOML files are planning records, which
# fab review-depth reviews as it does documentation.
planning = [".arcl/workspace/"]

# The fabrial version that wrote the installed files. `fab check`
# compares it with its own.
version = "0.9.0"

# The commands fab run uses for each step of a tracked task. Each is
# split on spaces and run in the task's worktree; {id}, {evidence}
# and {file} are replaced. init, when set, runs once in the new
# worktree before start. skill names the skill fab dispatch gives
# an implementer.
[tasks]
init = "arcl init"
skill = "arclightning"
show = "arcl task show {id}"
start = "arcl task start {id}"
complete = "arcl task complete {id} --evidence {evidence}"
handoff = "arcl task handoff {id} --note-file {file}"
