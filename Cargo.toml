[workspace]
members = ["crates/fab-core", "crates/fab-cli"]
resolver = "3"

[workspace.package]
version = "0.3.0"
edition = "2024"

[workspace.dependencies]
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
tempfile = "3.23"
thiserror = "2"
toml = "1.1"
