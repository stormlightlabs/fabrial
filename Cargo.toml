[workspace]
members = ["crates/fab-core", "crates/fab-cli"]
resolver = "3"

[workspace.package]
version = "0.4.0"
edition = "2024"
repository = "https://github.com/stormlightlabs/fabrial"

[workspace.dependencies]
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
tempfile = "3.23"
thiserror = "2"
toml = "1.1"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
